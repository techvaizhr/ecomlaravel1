<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cbYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD200"/>
      <stop offset="100%" stop-color="#FDB813"/>
    </linearGradient>
  </defs>
  <!-- Text 'carry' -->
  <g fill="#231F20" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="76" letter-spacing="-3">
    <text x="10" y="86">carry</text>
  </g>
  <!-- Bee Character & Text 'bee' -->
  <g fill="#231F20" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="76" letter-spacing="-3">
    <text x="202" y="86">b</text>
  </g>
  <!-- Bee Icon / Body merged with 'ee' -->
  <g transform="translate(258, 22)">
    <!-- Bee Head Antenna -->
    <path d="M45,2 C48,-6 60,-4 58,5 C57,10 50,14 44,13" fill="#FDB813"/>
    <path d="M56,-2 C59,-9 71,-7 69,2 C68,7 61,11 55,10" fill="#FDB813"/>
    <!-- Yellow Wing/Body Outer -->
    <path d="M12,48 C12,22 32,8 58,8 C84,8 104,22 104,48 C104,74 84,88 58,88 C32,88 12,74 12,48 Z" fill="url(#cbYellow)"/>
    <!-- Black Bee Stripes / Arcs -->
    <path d="M40,20 C48,22 56,28 62,38 C56,48 48,54 40,56 C34,46 34,30 40,20 Z" fill="#231F20" opacity="0.95"/>
    <path d="M62,18 C70,22 78,30 82,42 C78,54 70,62 62,66 C58,54 58,30 62,18 Z" fill="#231F20" opacity="0.95"/>
    <!-- White Inner Cutouts for 'ee' effect -->
    <ellipse cx="44" cy="50" rx="14" ry="16" fill="#ffffff"/>
    <ellipse cx="78" cy="50" rx="14" ry="16" fill="#ffffff"/>
    <ellipse cx="45" cy="50" rx="8" ry="10" fill="#231F20"/>
    <ellipse cx="79" cy="50" rx="8" ry="10" fill="#231F20"/>
  </g>
  <!-- Slogan: Delivering with Trust -->
  <text x="50" y="132" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-weight="500" font-size="28" fill="#4B5563" letter-spacing="0.5">Delivering with Trust</text>
</svg>
